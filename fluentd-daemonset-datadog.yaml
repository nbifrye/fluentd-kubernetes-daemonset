apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluentd
  namespace: kube-system
  labels:
    k8s-app: fluentd-logging
    version: v1
spec:
  selector:
    matchLabels:
      k8s-app: fluentd-logging
      version: v1
  template:
    metadata:
      labels:
        k8s-app: fluentd-logging
        version: v1
    spec:
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        effect: NoSchedule
      containers:
      - name: fluentd
        image: fluent/fluentd-kubernetes-daemonset:v1-debian-datadog
        env:
          - name: K8S_NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          - name: DD_API_KEY
            value: your-api-key
          # Optional: Datadog site / intake endpoint (default: http-intake.logs.datadoghq.com).
          # For EU: http-intake.logs.datadoghq.eu, US3: http-intake.logs.us3.datadoghq.com, etc.
          # - name: DD_SITE
          #   value: http-intake.logs.datadoghq.com
          # - name: DD_SOURCE
          #   value: kubernetes
          # - name: DD_SERVICE
          #   value: my-service
          # - name: DD_TAGS
          #   value: "env:prod,team:platform"
          # - name: DD_HOSTNAME
          #   value: my-cluster
          # Remove kubernetes/docker attributes from log records after they have been
          # extracted into Datadog tags (added in fluent-plugin-datadog 0.15.0).
          # - name: DD_DELETE_EXTRACTED_TAG_ATTRIBUTES
          #   value: "true"
        resources:
          limits:
            memory: 200Mi
          requests:
            cpu: 100m
            memory: 200Mi
        volumeMounts:
        - name: varlog
          mountPath: /var/log
        # When actual pod logs in /var/lib/docker/containers, the following lines should be used.
        # - name: dockercontainerlogdirectory
        #   mountPath: /var/lib/docker/containers
        #   readOnly: true
        # When actual pod logs in /var/log/pods, the following lines should be used.
        - name: dockercontainerlogdirectory
          mountPath: /var/log/pods
          readOnly: true
      terminationGracePeriodSeconds: 30
      volumes:
      - name: varlog
        hostPath:
          path: /var/log
      # When actual pod logs in /var/lib/docker/containers, the following lines should be used.
      # - name: dockercontainerlogdirectory
      #   hostPath:
      #     path: /var/lib/docker/containers
      # When actual pod logs in /var/log/pods, the following lines should be used.
      - name: dockercontainerlogdirectory
        hostPath:
          path: /var/log/pods
